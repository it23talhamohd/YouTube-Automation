name: Hourly Video Automation Pipeline

on:
  schedule:
    - cron: '0 * * * *'  # Runs hourly
  workflow_dispatch:      # Allows manual trigger from the GitHub interface

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Restore Config and Secrets
      env:
        CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
      run: |
        mkdir -p config
        # Recreate the Google OAuth credentials and tokens locally in the runner
        echo "$CREDENTIALS_JSON" > config/credentials.json
        echo "$TOKEN_JSON" > config/token.json

    - name: Run Automation Pipeline
      env:
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
      run: |
        python main.py --run

    - name: Commit and Push State Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # Track and commit changes to the local CSV database and scheduler state
        git add assets/local_database.csv || true
        git add -f config/scheduler_state.json || true
        git commit -m "Update video database and scheduler history [skip ci]" || true
        git push || true
